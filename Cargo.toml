[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/lobby",
    "crates/game-sdk",
    "crates/games/tictactoe",
    "crates/games/take_your_position",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# async runtime
tokio = { version = "1.39", features = ["full"] }
# serde
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# misc
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
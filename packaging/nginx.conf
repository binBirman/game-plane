# /etc/nginx/sites-available/lobby.conf
#
# Reverse proxy in front of the lobby server. Terminate TLS at nginx,
# forward plain HTTP/WS to 127.0.0.1:8192.
#
# After editing:
#   sudo ln -s /etc/nginx/sites-available/lobby.conf /etc/nginx/sites-enabled/lobby
#   sudo nginx -t && sudo systemctl reload nginx
#
# For Let's Encrypt:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d lobby.example.com
#   certbot will fill in the ssl_certificate / ssl_certificate_key below.

upstream lobby_backend {
    server 127.0.0.1:8192;
    keepalive 32;
}

# Redirect HTTP -> HTTPS (after certbot is set up).
server {
    listen 80;
    listen [::]:80;
    server_name lobby.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lobby.example.com;

    ssl_certificate     /etc/letsencrypt/live/lobby.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lobby.example.com/privkey.pem;

    # Forward client IP to the lobby so per-IP rate limiting works.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;

    # WebSocket support: lobby serves /ws/:instance_id as a single endpoint.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Body / buffer
    client_max_body_size 1m;

    # Light rate limiting at nginx too (defense in depth).
    limit_req_zone $binary_remote_addr zone=lobby_login:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=lobby_reg:10m   rate=5r/s;

    location /api/login {
        limit_req zone=lobby_login burst=20 nodelay;
        proxy_pass http://lobby_backend;
    }
    location /api/register {
        limit_req zone=lobby_reg burst=10 nodelay;
        proxy_pass http://lobby_backend;
    }
    location /api/ {
        proxy_pass http://lobby_backend;
    }
    location /ws/ {
        proxy_pass http://lobby_backend;
    }
    location / {
        proxy_pass http://lobby_backend;
    }
}